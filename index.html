<!DOCTYPE html>

<body>
<input id="name" placeholder="Имя"><button id="login">Войти</button>
<div id="log"></div>
<script>
const SUPABASE_URL = "https://tmjqafqecjpizawdruzq.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRtanFhZnFlY2pwaXphd2RydXpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4OTk2OTYsImV4cCI6MjA5NTQ3NTY5Nn0.8K7i5QEbjYWSvqw78P8RSR_abYM8uCRZbvC9Hp12bac";

function addMsg(m) { document.getElementById("log").innerHTML += "<br>" + m; }

document.getElementById("login").onclick = async () => {
    let name = document.getElementById("name").value;
    let res = await fetch(`${SUPABASE_URL}/rest/v1/players?username=eq.${name}`, {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    let data = await res.json();
    if(data.length === 0) {
        await fetch(`${SUPABASE_URL}/rest/v1/players`, {
            method: 'POST',
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: name, gold: 800 })
        });
        addMsg("✅ Создан новый игрок: " + name);
    } else {
        addMsg("✅ Загружен игрок: " + name + ", голда: " + data[0].gold);
    }
};
</script>
