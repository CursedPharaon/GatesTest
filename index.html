<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Тест Supabase</title></head>
<body>
    <input id="name" placeholder="Имя">
    <button onclick="login()">Войти</button>
    <div id="res"></div>
    <script>
        const URL = "https://tmjqafqecjpizawdruzq.supabase.co";
        const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRtanFhZnFlY2pwaXphd2RydXpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4OTk2OTYsImV4cCI6MjA5NTQ3NTY5Nn0.8K7i5QEbjYWSvqw78P8RSR_abYM8uCRZbvC9Hp12bac";
        
        async function login() {
            const name = document.getElementById('name').value;
            document.getElementById('res').innerHTML = '🔄 Загрузка...';
            try {
                const res = await fetch(`${URL}/rest/v1/players?username=eq.${name}`, {
                    headers: { 'apikey': KEY, 'Authorization': `Bearer ${KEY}` }
                });
                const data = await res.json();
                if (data.length === 0) {
                    await fetch(`${URL}/rest/v1/players`, {
                        method: 'POST',
                        headers: { 'apikey': KEY, 'Authorization': `Bearer ${KEY}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: name, gold: 1000 })
                    });
                    document.getElementById('res').innerHTML = '✅ Создан новый игрок!';
                } else {
                    document.getElementById('res').innerHTML = '✅ Загружен игрок: ' + data[0].username + ', золота: ' + data[0].gold;
                }
            } catch(e) {
                document.getElementById('res').innerHTML = '❌ Ошибка: ' + e.message;
            }
        }
    </script>
</body>
</html>
