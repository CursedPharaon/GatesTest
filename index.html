<!DOCTYPE html>

    <style id="theme-style">
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: #0a0c16; font-family: system-ui, monospace; margin: 0; padding: 8px; min-height: 100vh; color: #eef4ff; transition: background 0.2s; }
        body.light { background: #e8edf5; color: #1a2a3a; }
        body.light .game-container { background: #ffffff; box-shadow: 0 0 0 1px #c0d0e0; }
        body.light .stats-panel { background: #f0f4fa; border-bottom-color: #c0d0e0; color: #1a2a3a; }
        body.light .stats-panel span { color: #c97e00; }
        body.light .chat { background: #f5f7fc; }
        body.light .msg { background: #e8edf5; border-left-color: #4c7a9a; color: #1a2a3a; }
        body.light .msg.system { background: #e0e8f0; border-left-color: #d6b356; }
        body.light .enemy-panel { background: #e0e8f0; color: #1a2a3a; }
        body.light .buttons-panel { background: #f0f4fa; border-color: #c0d0e0; }
        body.light .buttons-panel button { background: #4c7a9a; color: white; }
        body.light .input-area { background: #f0f4fa; border-color: #c0d0e0; }
        body.light input { background: #ffffff; color: #1a2a3a; border: 1px solid #c0d0e0; }
        body.light .sub-panel { background: #f0f4fa; }
        body.light .select-item, body.light .shop-item, body.light .craft-item { background: #e0e8f0; color: #1a2a3a; }
        .game-container { max-width: 700px; margin: 0 auto; background: #03060e; border-radius: 28px; width: 100%; box-shadow: 0 0 0 1px #2a3f55; overflow: hidden; }
        .stats-panel { background: #010a17; padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; font-size: 0.7rem; font-weight: bold; border-bottom: 1px solid #1f3a4b; position: relative; }
        .stats-panel span { color: #f5bc70; }
        .version-badge { position: absolute; top: 4px; right: 8px; font-size: 0.55rem; color: #6a8aaa; opacity: 0.7; }
        .enemy-panel { background: #0d1a2a; padding: 8px; margin: 6px 10px; border-radius: 20px; display: flex; justify-content: space-between; font-weight: bold; font-size: 0.8rem; }
        .enemy-effects { font-size: 0.65rem; color: #ffaa66; }
        .chat { max-height: 35vh; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; background: #051020; font-size: 0.8rem; }
        .msg { background: #0f1a2c; padding: 6px 10px; border-radius: 18px; word-wrap: break-word; border-left: 3px solid #4c7a9a; align-self: flex-start; max-width: 94%; }
        .msg.system { background: #121e2e; border-left-color: #d6b356; }
        .msg.achievement { background: #1a2a1a; border-left-color: #6bc46b; }
        .msg.critical { background: #3a1a1a; border-left-color: #ff4444; font-weight: bold; }
        .buttons-panel { background: #030c17; padding: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; border-top: 1px solid #1a3045; border-bottom: 1px solid #1a3045; }
        .buttons-panel button { background: #1f3a52; border: none; color: white; font-weight: bold; padding: 10px 8px; border-radius: 40px; font-size: 0.75rem; cursor: pointer; }
        .buttons-panel button:active { transform: scale(0.96); }
        .active-mode { background: #4c7a9a !important; box-shadow: 0 0 6px #7ab3c8; }
        .input-area { display: flex; gap: 8px; padding: 10px; background: #030c17; border-top: 1px solid #1a3045; }
        input { flex: 1; background: #0f1b2f; border: none; padding: 12px 16px; border-radius: 40px; color: white; font-size: 0.9rem; outline: none; }
        button { background: #2c4f6e; border: none; color: white; padding: 8px 16px; border-radius: 40px; cursor: pointer; }
        .hidden { display: none; }
        .sub-panel { background: #0a1424; margin: 5px 10px; border-radius: 20px; padding: 8px; max-height: 250px; overflow-y: auto; }
        .class-selector { display: flex; gap: 12px; justify-content: center; margin: 10px; }

        .select-item { background: #162336; padding: 6px 10px; border-radius: 40px; cursor: pointer; margin: 2px; font-size: 0.7rem; }
        .craft-item { background: #162336; padding: 6px; border-radius: 16px; margin: 4px; cursor: pointer; }
        .craft-recipe { font-size: 0.6rem; color: #aac8ff; }
        .craft-damage { font-size: 0.65rem; color: #ffaa66; font-weight: bold; margin-left: 6px; }
        .shop-item { background: #162336; padding: 6px 10px; border-radius: 40px; margin: 3px; cursor: pointer; font-size: 0.7rem; display: flex; justify-content: space-between; }
        hr { border-color: #2e4b6e; margin: 5px; }
        .promo-btn, .theme-btn { background: #4a2e6e; grid-column: span 2; margin-top: 4px; }

    </style>
</head>

            method: 'POST',

        });
    }
    
    async function supabaseTransferGold(toName, amount) {
        if (amount <= 0) return "❌ Сумма должна быть больше 0";
        if (player.gold < amount) return "❌ Не хватает золота";
        if (toName === currentPlayerName) return "❌ Нельзя передать самому себе";
        
        // Загружаем получателя
        const target = await supabaseLoadPlayer(toName);
        if (!target) return "❌ Игрок не найден";
        
        // Снимаем у отправителя
        player.gold -= amount;
        await supabaseSavePlayer();
        
        // Добавляем получателю через прямое обновление
        const targetNewGold = target.gold + amount;
        const updateRes = await fetch(`${SUPABASE_URL}/rest/v1/players?username=eq.${encodeURIComponent(toName)}`, {
            method: 'PATCH',
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ gold: targetNewGold })
        });
        
        if (!updateRes.ok) {
            // Если ошибка — возвращаем деньги
            player.gold += amount;
            await supabaseSavePlayer();
            return "❌ Ошибка передачи, деньги возвращены";
        }
        
        updateUI();
        return `💰 Передано ${amount} золота игроку ${toName}!`;
    }

    let audioCtx = null;
    function playSound(type) {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = "sine";
            gain.gain.value = 0.15;
            if (type === "attack") { osc.frequency.value = 440; gain.gain.exponentialRampToValue(0.00001, 0.3); }
            else if (type === "heal") { osc.frequency.value = 660; gain.gain.exponentialRampToValue(0.00001, 0.4); }
            else if (type === "victory") { osc.frequency.value = 880; gain.gain.exponentialRampToValue(0.00001, 0.5); }
            else if (type === "hit") { osc.frequency.value = 220; gain.gain.exponentialRampToValue(0.00001, 0.2); }
            else return;
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } catch(e) {}

    function addSys(msg, type = "system") { 
        let chat = document.getElementById("chatArea"); 
        let d = document.createElement("div"); 
        d.className = `msg ${type}`; 
        d.innerHTML = msg; 
        chat.appendChild(d); 
        chat.scrollTop = chat.scrollHeight; 
        if (chat.children.length > 200) chat.removeChild(chat.children[0]);
    }
    
    function clearChat() {
        let chat = document.getElementById("chatArea");
        chat.innerHTML = '<div class="msg system">🌀 Чат очищен.</div><div class="msg system">💡 Команды: статы, помощь, инфо, очистить, /передать Имя 100, /топ, /синхронизация</div>';
    }
    
    function getTotalDamageBonus() { return 1 + (talents.physical.bonus / 100); }
    function getCritChance() { return 0.05 + (talents.crit.bonus / 100); }
    function getMaxHpBonus() { return 1 + (talents.health.bonus / 100); }
    function getEquipmentBonus() { return (equipment.helmet?.armor||0) + (equipment.chest?.armor||0) + (equipment.boots?.armor||0) + (equipment.ring?.armor||0); }
    function getWeaponDamage() { return (player.weapon ? player.weapon.dmg : 10) + weaponUpgrade * 5; }
    function getDamage() { return Math.floor((getWeaponDamage() + player.level * 1.2) * getTotalDamageBonus()) + Math.floor(Math.random() * 12); }
    
    function applyEffects(target, isEnemy) {
        let effects = isEnemy ? enemyEffects : playerEffects;
        let msg = "";
        if (effects.bleed > 0) {
            let dmg = Math.floor(5 + player.level * 0.5);
            if (isEnemy) player.currentEnemy.hp -= dmg;
            else player.hp -= dmg;
            effects.bleed--;
            msg += `🩸 Кровотечение -${dmg} HP. `;
        }
        if (effects.poison > 0) {
            let dmg = Math.floor(4 + player.level * 0.4);
            if (isEnemy) player.currentEnemy.hp -= dmg;
            else player.hp -= dmg;
            effects.poison--;
            msg += `☠️ Отравление -${dmg} HP. `;
        }
        if (msg) addSys(msg);
        if (!isEnemy && player.hp <= 0) { 
            addSys("💀 Вы умерли от эффектов!"); 
            player.hp = player.maxHp; 
            player.inBattle = false; 
            if(player.attackInterval) clearInterval(player.attackInterval); 
            player.currentEnemy = null; 
            trialMode = false;
            supabaseSavePlayer();
        }
        if (isEnemy && player.currentEnemy && player.currentEnemy.hp <= 0) defeatEnemy();
        updateUI();
    }
    
    function attack() {
        if (!player.inBattle || !player.currentEnemy) { addSys("Нет боя!"); return; }
        let isCrit = Math.random() < getCritChance();
        let dmg = getDamage();
        if (isCrit) { dmg = Math.floor(dmg * 1.75); addSys(`💥 КРИТИЧЕСКИЙ УДАР!`, "critical"); playSound("attack"); showToast("КРИТ!"); }
        else playSound("attack");
        player.currentEnemy.hp -= dmg;
        addSys(`⚔️ Урон ${dmg}${isCrit ? " (КРИТ)" : ""}. У ${player.currentEnemy.name} осталось ${Math.max(0, Math.floor(player.currentEnemy.hp))} HP.`);
        if (Math.random() < 0.2) { enemyEffects.bleed = Math.max(enemyEffects.bleed, 3); addSys("🩸 Враг истекает кровью!"); }
        if (player.currentEnemy.hp <= 0) { defeatEnemy(); }
        updateUI(); 
        supabaseSavePlayer();
    }
    
    function defeatEnemy() {
        let goldGain = player.currentEnemy.gold + Math.floor(Math.random() * 60);
        let xpGain = player.currentEnemy.xp + player.level * 4;
        let gloryGain = player.currentEnemy.glory || 5;
        player.gold += goldGain;
        player.xp += xpGain;
        player.glory += gloryGain;
        player.stats.totalGoldEarned += goldGain;
        player.stats.totalKills++;
        if (player.currentEnemy.needKey) player.stats.eliteKills++;
        achievements.gold.current = player.stats.totalGoldEarned;
        achievements.kills.current = player.stats.totalKills;
        achievements.eliteKills.current = player.stats.eliteKills;
        addSys(`🏆 Победа! +${goldGain}💰 +${xpGain}✨ опыта +${gloryGain}✨ славы!`);
        playSound("victory");
        showToast(`+${goldGain}💰 +${xpGain}✨`);
        
        dailyQuests.forEach(q => { if (!q.claimed && q.type === "kill") { q.current += 1; if (q.current >= q.target) addSys(`📅 Задание выполнено: ${q.name}!`); } });
        if (player.currentEnemy.needKey) {
            dailyQuests.forEach(q => { if (!q.claimed && q.type === "elite") { q.current += 1; } });
        }
        
        if (player.currentEnemy.equipmentChance && Math.random() < player.currentEnemy.equipmentChance) {
            const newEquip = getRandomEquipment();
            const oldItem = equipment[newEquip.type];
            if (!oldItem || newEquip.armor > oldItem.armor) {
                equipment[newEquip.type] = newEquip;
                if (newEquip.hpBonus) { player.maxHp += newEquip.hpBonus; if (oldItem?.hpBonus) player.maxHp -= oldItem.hpBonus; player.hp = player.maxHp; }
                addSys(`✨ ВЫ НАШЛИ: ${newEquip.name}!`, "achievement");
            }
        }
        
        let need = 100 + player.level * 12;
        while (player.xp >= need) {
            player.level++;
            player.xp -= need;
            player.maxHp += 20;
            player.hp = player.maxHp;
            talents.availablePoints++;
            addSys(`✨ УРОВЕНЬ ${player.level}! +1 очко талантов!`);
            need = 100 + player.level * 12;
            checkAchievements();
        }
        
        if (player.currentEnemy.key && Math.random() < player.currentEnemy.keyChance) {
            player.keys[player.currentEnemy.key]++;
            addSys(`🔑 Выпал ${player.currentEnemy.key}!`);
        }
        
        if (player.currentEnemy.drops) {
            for (let d of player.currentEnemy.drops) {
                if (Math.random() < d.chance && d.material) {
                    player.materials[d.material] = (player.materials[d.material] || 0) + d.qty;
                    addSys(`📦 Материал: +${d.qty} ${d.material}`);
                }
            }
        }
        
        if (trialMode) {
            trialWaves++;
            if (trialWaves >= trialMaxWaves) {
                addSys(`🔥 ИСПЫТАНИЕ ПРОЙДЕНО! +500✨ славы и +2000💰!`);
                player.glory += 500;
                player.gold += 2000;
                trialMode = false;
                trialWaves = 0;
                showToast("Испытание пройдено!");
            } else {
                addSys(`🔥 Испытание: волна ${trialWaves+1}/${trialMaxWaves}. Следующий враг...`);
                startNextTrialWave();
                supabaseSavePlayer();
                return;
            }
        }
        
        player.inBattle = false;
        if (player.attackInterval) clearInterval(player.attackInterval);
        player.currentEnemy = null;
        updateUI();
        supabaseSavePlayer();
        checkAchievements();
    }
    
    function startNextTrialWave() {
        let nextBoss = JSON.parse(JSON.stringify(NORMAL_BOSSES[Math.floor(Math.random() * NORMAL_BOSSES.length)]));
        nextBoss.hp = Math.floor(nextBoss.hp * (1 + trialWaves * 0.15));
        nextBoss.atk = Math.floor(nextBoss.atk * (1 + trialWaves * 0.1));
        player.currentEnemy = nextBoss;
        player.inBattle = true;
        addSys(`⚔️ ВОЛНА ${trialWaves+1}: Бой с ${nextBoss.name}`);
        updateUI();
    }
    
    function startTrial() {
        if (player.inBattle) { addSys("Вы уже в бою!"); return; }
        if (!player.class) { addSys("Сначала выберите класс!"); return; }
        trialMode = true;
        trialWaves = 0;
        startNextTrialWave();
    }
    
    function enemyAttack() {
        if (!player.inBattle || !player.currentEnemy) return;
        let dmg = Math.max(6, player.currentEnemy.atk + Math.floor(Math.random() * 14) - Math.floor(player.level * 0.3) - getEquipmentBonus());
        player.hp -= dmg;
        playSound("hit");
        addSys(`😖 ${player.currentEnemy.name} атакует! -${dmg} HP. Осталось ${Math.floor(player.hp)}/${player.maxHp}`);
        if (Math.random() < 0.15) { playerEffects.bleed = Math.max(playerEffects.bleed, 2); addSys("🩸 Вы истекаете кровью!"); }
        if (player.hp <= 0) {
            addSys(`💀 Вы пали... Потеря 20% золота и славы.`);
            player.gold = Math.floor(player.gold * 0.8);
            player.glory = Math.floor(player.glory * 0.8);
            player.hp = player.maxHp;
            player.inBattle = false;
            if(player.attackInterval) clearInterval(player.attackInterval);
            player.currentEnemy = null;
            trialMode = false;
            supabaseSavePlayer();
        }
        updateUI(); 
        supabaseSavePlayer();
    }
    
    function startBattle(enemy) {
        if (player.inBattle) { addSys("Вы уже в бою!"); return; }
        if (trialMode) { addSys("Сначала завершите испытание!"); return; }
        player.currentEnemy = JSON.parse(JSON.stringify(enemy));
        player.inBattle = true;
        addSys(`⚔️ Бой с ${enemy.name} (❤️ ${enemy.hp} | ⚔️ ${enemy.atk})`);
        updateUI();
    }
    
    function heal() {
        let cost = 45;
        if (player.gold >= cost && player.hp < player.maxHp) {
            player.gold -= cost;
            player.hp = Math.min(player.maxHp, player.hp + 40 + player.level);
            addSys(`💚 Лечение +${40+player.level} HP. -${cost}💰.`);
            playSound("heal");
            supabaseSavePlayer();
        } else addSys(`❌ Не хватает.`);
        updateUI();
    }
    
    function toggleAutoAttack() {
        player.autoAttack = !player.autoAttack;
        if(player.autoAttack){
            addSys(`🔄 Авто-атака ВКЛ`);
            if(player.attackInterval) clearInterval(player.attackInterval);
            player.attackInterval = setInterval(()=>{ if(player.inBattle && player.currentEnemy?.hp>0 && player.hp>0) attack(); }, 3500);
            document.getElementById("autoAttackBtn").classList.add("active-mode");
        } else {
            addSys(`🔴 Авто-атака ВЫКЛ`);
            if(player.attackInterval) clearInterval(player.attackInterval);
            document.getElementById("autoAttackBtn").classList.remove("active-mode");
        }
    }
    
    function toggleAutoHeal() {
        player.autoHeal = !player.autoHeal;
        if(player.autoHeal){
            addSys(`💊 Авто-лечение ВКЛ`);
            if(player.healInterval) clearInterval(player.healInterval);
            player.healInterval = setInterval(()=>{ if(player.autoHeal && player.hp/player.maxHp<0.7 && player.gold>=45) heal(); }, 5500);
            document.getElementById("autoHealBtn").classList.add("active-mode");
        } else {
            addSys(`💊 Авто-лечение ВЫКЛ`);
            if(player.healInterval) clearInterval(player.healInterval);
            document.getElementById("autoHealBtn").classList.remove("active-mode");
        }
    }
    
    function updateUI() {
        document.getElementById("className").innerText = player.class ? (player.class === "warrior" ? "Воин" : player.class === "mage" ? "Маг" : "Лучник") : "???";
        document.getElementById("lvl").innerText = player.level;
        document.getElementById("skillPointsDisplay").innerHTML = `⭐${talents.availablePoints}`;
        let maxHpBonus = Math.floor(player.maxHp * getMaxHpBonus());
        document.getElementById("hp").innerText = Math.floor(player.hp);
        document.getElementById("maxHp").innerText = maxHpBonus;
        document.getElementById("mp").innerText = Math.floor(player.mp);
        document.getElementById("maxMp").innerText = player.maxMp;
        document.getElementById("gold").innerText = Math.floor(player.gold);
        document.getElementById("glory").innerText = Math.floor(player.glory);
        let totalKeys = Object.values(player.keys).reduce((a,b)=>a+b,0);
        document.getElementById("keyCount").innerText = totalKeys;
        let dmg = getWeaponDamage() + Math.floor(player.level * 1.2);
        document.getElementById("dmgStat").innerText = Math.floor(dmg);
        if (player.inBattle && player.currentEnemy) {
            document.getElementById("enemyPanel").style.display = "flex";
            document.getElementById("enemyName").innerText = player.currentEnemy.name;
            document.getElementById("enemyHp").innerText = Math.max(0, Math.floor(player.currentEnemy.hp));
            document.getElementById("enemyAtk").innerText = player.currentEnemy.atk;
            let effectsText = "";
            if (enemyEffects.bleed > 0) effectsText += `🩸${enemyEffects.bleed} `;
            if (enemyEffects.poison > 0) effectsText += `☠️${enemyEffects.poison} `;
            document.getElementById("enemyEffects").innerText = effectsText;
        } else { document.getElementById("enemyPanel").style.display = "none"; }
        let trialBtn = document.getElementById("trialBtn");
        if (trialMode) trialBtn.classList.add("trial-active");
        else trialBtn.classList.remove("trial-active");
    }
    
    function checkAchievements() {
        if (!achievements.kills.claimed && achievements.kills.current >= achievements.kills.target) {
            achievements.kills.claimed = true;
            player.gold += achievements.kills.reward.gold;
            player.glory += achievements.kills.reward.glory;
            addSys(`🏆 Достижение "${achievements.kills.name}"! +${achievements.kills.reward.gold}💰 +${achievements.kills.reward.glory}✨`, "achievement");
        }
        if (!achievements.eliteKills.claimed && achievements.eliteKills.current >= achievements.eliteKills.target) {
            achievements.eliteKills.claimed = true;
            player.gold += achievements.eliteKills.reward.gold;
            player.glory += achievements.eliteKills.reward.glory;
            addSys(`🏆 Достижение "${achievements.eliteKills.name}"! +${achievements.eliteKills.reward.gold}💰 +${achievements.eliteKills.reward.glory}✨`, "achievement");

    function activatePromo(code) {
        let found = PROMO_CODES.find(p => p.code.toLowerCase() === code.toLowerCase());
        if (!found) { addSys(`❌ Промокод "${code}" не найден!`); return false; }
        if (player.usedPromoCodes.includes(found.code)) { addSys(`⚠️ Промокод уже активирован!`); return false; }
        if (found.money) player.gold += found.money;
        if (found.exp) player.xp += found.exp;
        if (found.glory) player.glory += found.glory;
        if (found.keyBonus) player.keys[found.keyBonus] += found.keyQty;
        if (found.materialBonus) player.materials[found.materialBonus] += found.materialQty;
        addSys(`🎉 Промокод "${found.name}" активирован!`);
        player.usedPromoCodes.push(found.code);
        let need = 100 + player.level * 12;
        while (player.xp >= need) { player.level++; player.xp -= need; player.maxHp += 20; player.hp = player.maxHp; talents.availablePoints++; addSys(`✨ УРОВЕНЬ ${player.level}! +1 очко талантов`); need = 100 + player.level * 12; }
        updateUI(); supabaseSavePlayer(); return true;
    }

    async function processCommand(cmd) { 
        let c = cmd.trim().toLowerCase();
        
        if (c.startsWith("/передать")) {
            const parts = cmd.split(" ");
            if (parts.length >= 3) {
                const result = await supabaseTransferGold(parts[1], parseInt(parts[2]));
                addSys(result);
                updateUI();
                supabaseSavePlayer();
            } else {
                addSys("❌ Использование: /передать Имя 100");
            }
            return;
        }
        if (c === "/топ") {
            const topMsg = await supabaseShowTop();
            addSys(topMsg);
            return;
        }
        if (c === "/синхронизация") {
            await fullReloadFromDatabase();
            return;
        }
        
        if (c === "очистить") { clearChat(); return; }
        if (c.startsWith("инфо")) {
            let arg = cmd.substring(4).trim();
            if (arg === "воин") addSys("⚔️ Воин: высокое HP");
            else addSys("❌ Инфо не найдено");
            return;
        }
        let foundPromo = PROMO_CODES.find(p => p.code.toLowerCase() === c);
        if (foundPromo) { activatePromo(foundPromo.code); return; }
        if(c === "статы") statsCmd();
        else if(c === "помощь") addSys(`Команды: статы, очистить, /передать Имя 100, /топ, /синхронизация, открой врата`);
        else if(c === "открой врата") secretBoss();
        else addSys(`❓ Неизвестно. Введите "помощь".`); 
    }

        if (!playerData) {
            playerData = await supabaseCreatePlayer(name);
            addSys(`🌀 Новый игрок: ${name}`);
        } else {
            addSys(`🌀 С возвращением, ${name}`);
        }
        
        currentPlayerName = name;
        
        // Загружаем данные в игрока
        player.gold = playerData.gold;
        player.glory = playerData.glory;
        player.level = playerData.level;
        player.hp = playerData.hp;
        player.maxHp = playerData.max_hp;
        
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("gameContainer").style.display = "block";
        
        if (!player.class) {
            document.getElementById("dynamicPanel").innerHTML=`<div class="class-selector"><div class="class-btn" id="classWar">⚔️ ВОИН</div><div class="class-btn" id="classMage">🔮 МАГ</div><div class="class-btn" id="classArch">🏹 ЛУЧНИК</div></div>`; 
            document.getElementById("dynamicPanel").classList.remove("hidden"); 
            document.getElementById("classWar").onclick=()=>{setClass("warrior"); document.getElementById("dynamicPanel").classList.add("hidden");};
            document.getElementById("classMage").onclick=()=>{setClass("mage"); document.getElementById("dynamicPanel").classList.add("hidden");};
            document.getElementById("classArch").onclick=()=>{setClass("archer"); document.getElementById("dynamicPanel").classList.add("hidden");};
        }
        
        updateUI();
        
        // Сброс кнопки
        document.getElementById("loginBtn").innerText = "Войти";
        document.getElementById("loginBtn").disabled = false;
    };
    
    const savedName = localStorage.getItem("savedPlayerName");
    if (savedName) {
        document.getElementById("loginName").value = savedName;
        setTimeout(() => {
            if (document.getElementById("loginScreen").style.display !== "none") {
                document.getElementById("loginBtn").click();
            }
        }, 100);
    }
    
    let savedTheme = localStorage.getItem("theme");
    if (savedTheme === "light") document.body.classList.add("light");
</script>
</body>
</html>
