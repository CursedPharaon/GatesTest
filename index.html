<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Тысячи врат: Текстовая RPG</title>
    <style id="theme-style">
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: #0a0c16; font-family: system-ui, monospace; margin: 0; padding: 8px; min-height: 100vh; color: #eef4ff; transition: background 0.2s; }
        body.light { background: #e8edf5; color: #1a2a3a; }
        body.light .game-container { background: #ffffff; box-shadow: 0 0 0 1px #c0d0e0; }
        body.light .stats-panel { background: #f0f4fa; border-bottom-color: #c0d0e0; color: #1a2a3a; }
        body.light .stats-panel span { color: #c97e00; }
        body.light .chat { background: #f5f7fc; }
        body.light .msg { background: #e8edf5; border-left-color: #4c7a9a; color: #1a2a3a; }
        body.light .msg.system { background: #e0e8f0; border-left-color: #d6b356; }
        body.light .enemy-panel { background: #e0e8f0; color: #1a2a3a; }
        body.light .buttons-panel { background: #f0f4fa; border-color: #c0d0e0; }
        body.light .buttons-panel button { background: #4c7a9a; color: white; }
        body.light .input-area { background: #f0f4fa; border-color: #c0d0e0; }
        body.light input { background: #ffffff; color: #1a2a3a; border: 1px solid #c0d0e0; }
        body.light .sub-panel { background: #f0f4fa; }
        body.light .select-item, body.light .shop-item, body.light .craft-item { background: #e0e8f0; color: #1a2a3a; }
        .game-container { max-width: 700px; margin: 0 auto; background: #03060e; border-radius: 28px; width: 100%; box-shadow: 0 0 0 1px #2a3f55; overflow: hidden; }
        .stats-panel { background: #010a17; padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; font-size: 0.7rem; font-weight: bold; border-bottom: 1px solid #1f3a4b; position: relative; }
        .stats-panel span { color: #f5bc70; }
        .version-badge { position: absolute; top: 4px; right: 8px; font-size: 0.55rem; color: #6a8aaa; opacity: 0.7; }
        .enemy-panel { background: #0d1a2a; padding: 8px; margin: 6px 10px; border-radius: 20px; display: flex; justify-content: space-between; font-weight: bold; font-size: 0.8rem; }
        .enemy-effects { font-size: 0.65rem; color: #ffaa66; }
        .chat { max-height: 35vh; overflow-y: auto; padding: 10px; background: #051020; font-size: 0.8rem; }
        .msg { background: #0f1a2c; padding: 6px 10px; border-radius: 18px; word-wrap: break-word; border-left: 3px solid #4c7a9a; align-self: flex-start; max-width: 94%; margin-bottom: 6px; }
        .msg.system { background: #121e2e; border-left-color: #d6b356; }
        .msg.achievement { background: #1a2a1a; border-left-color: #6bc46b; }
        .msg.critical { background: #3a1a1a; border-left-color: #ff4444; font-weight: bold; }
        .buttons-panel { background: #030c17; padding: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; border-top: 1px solid #1a3045; border-bottom: 1px solid #1a3045; }
        .buttons-panel button { background: #1f3a52; border: none; color: white; font-weight: bold; padding: 10px 8px; border-radius: 40px; font-size: 0.75rem; cursor: pointer; }
        .buttons-panel button:active { transform: scale(0.96); }
        .active-mode { background: #4c7a9a !important; box-shadow: 0 0 6px #7ab3c8; }
        .input-area { display: flex; gap: 8px; padding: 10px; background: #030c17; border-top: 1px solid #1a3045; }
        input { flex: 1; background: #0f1b2f; border: none; padding: 12px 16px; border-radius: 40px; color: white; font-size: 0.9rem; outline: none; }
        button { background: #2c4f6e; border: none; color: white; padding: 8px 16px; border-radius: 40px; cursor: pointer; }
        .hidden { display: none; }
        .sub-panel { background: #0a1424; margin: 5px 10px; border-radius: 20px; padding: 8px; max-height: 250px; overflow-y: auto; }
        .class-selector { display: flex; gap: 12px; justify-content: center; margin: 10px; }
        .class-btn { background: #2a3f55; padding: 12px; flex: 1; text-align: center; border-radius: 60px; font-weight: bold; cursor: pointer; }
        .select-list { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; max-height: 180px; overflow-y: auto; }
        .select-item { background: #162336; padding: 6px 10px; border-radius: 40px; cursor: pointer; margin: 2px; font-size: 0.7rem; }
        .craft-item { background: #162336; padding: 6px; border-radius: 16px; margin: 4px; cursor: pointer; }
        .craft-recipe { font-size: 0.6rem; color: #aac8ff; }
        .shop-item { background: #162336; padding: 6px 10px; border-radius: 40px; margin: 3px; cursor: pointer; font-size: 0.7rem; display: flex; justify-content: space-between; }
        hr { border-color: #2e4b6e; margin: 5px; }
        .promo-btn, .theme-btn { background: #4a2e6e; grid-column: span 2; margin-top: 4px; }
        .theme-btn { background: #2e5a6e; }
        .glory { color: #ffd966; }
        .daily-boss-btn { background: #8b5e3c; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1a2a3a; color: #ffd966; padding: 8px 16px; border-radius: 40px; font-size: 0.8rem; z-index: 1000; animation: fadeOut 2s ease forwards; pointer-events: none; white-space: nowrap; }
        @keyframes fadeOut { 0% { opacity: 1; } 100% { opacity: 0; } }
        .skill-points { background: #4a2e6e; border-radius: 20px; padding: 2px 8px; }
        .login-screen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #0a0c16; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; }
        .login-screen input { width: 80%; margin: 10px; text-align: center; font-size: 18px; padding: 12px; border-radius: 40px; border: none; background: #1a2a3a; color: white; }
        .login-screen button { width: 80%; background: #4c7a9a; font-size: 18px; padding: 12px; border-radius: 40px; border: none; color: white; }
    </style>
</head>
<body>

<div class="login-screen" id="loginScreen">
    <h2>🌀 Тысячи врат</h2>
    <input type="text" id="loginName" placeholder="Введи имя" autocomplete="off">
    <button id="loginBtn">Войти</button>
</div>

<div class="game-container" id="gameContainer" style="display: none;">
    <div class="stats-panel">
        <div>⚔️ <span id="className">???</span> | Ур.<span id="lvl">1</span> <span id="skillPointsDisplay" class="skill-points">⭐0</span></div>
        <div>❤️ <span id="hp">200</span>/<span id="maxHp">200</span></div>
        <div>💙 <span id="mp">50</span>/<span id="maxMp">50</span></div>
        <div>🪙 <span id="gold">800</span></div>
        <div>✨ <span id="glory" class="glory">0</span></div>
        <div>⚡ УРН <span id="dmgStat">20</span></div>
        <div>🔑 <span id="keyCount">0</span></div>
        <div class="version-badge" id="versionDisplay">v2.0.0</div>
    </div>
    <div class="enemy-panel" id="enemyPanel" style="display: none;">
        <div><span>👾 <span id="enemyName">Гоблин</span></span><div class="enemy-effects" id="enemyEffects"></div></div>
        <span>❤️ <span id="enemyHp">120</span></span>
        <span>⚔️ <span id="enemyAtk">28</span></span>
    </div>
    <div class="chat" id="chatArea">
        <div class="msg system">🌀 Тысячи врат</div>
        <div class="msg system">👑 Админ-команды работают и сохраняются в БД!</div>
        <div class="msg system">⚔️ ПВП: /пвп вызвать Имя 1000, /пвп ставка 1000, /пвп подтвердить, /пвп отклонить, /пвп статус</div>
    </div>
    <div id="dynamicPanel" class="sub-panel hidden"></div>
    <div class="buttons-panel">
        <button id="questBtn">📜 КВЕСТЫ</button>
        <button id="bossListBtn">👑 БОССЫ</button>
        <button id="dailyBossBtn" class="daily-boss-btn">⭐ ЕЖЕДНЕВНЫЙ</button>
        <button id="attackBtn">⚔️ АТАКА</button>
        <button id="autoAttackBtn">🔄 АВТО</button>
        <button id="healBtn">💚 ЛЕЧИТЬ</button>
        <button id="autoHealBtn">💊 АВТОХИЛ</button>
        <button id="shopBtn">🏪 МАГАЗИН</button>
        <button id="gloryShopBtn">✨ СЛАВА</button>
        <button id="inventoryBtn">📦 ИНВЕНТАРЬ</button>
        <button id="craftBtn">⚙️ КРАФТ</button>
        <button id="achievementsBtn">🏆 ДОСТИЖЕНИЯ</button>
        <button id="dailyQuestsBtn">📅 ЗАДАНИЯ</button>
        <button id="talentsBtn">⭐ ТАЛАНТЫ</button>
        <button id="trialBtn">🔥 ИСПЫТАНИЕ</button>
        <button id="promoBtn" class="promo-btn">🎁 ПРОМОКОД</button>
        <button id="themeBtn" class="theme-btn">🌓 ТЕМА</button>
    </div>
    <div class="input-area">
        <input type="text" id="cmdInput" placeholder="/помощь" autocomplete="off">
        <button id="sendBtn">➤</button>
    </div>
</div>

<script>
    // ========== SUPABASE НАСТРОЙКИ ==========
    const SUPABASE_URL = "https://tmjqafqecjpizawdruzq.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRtanFhZnFlY2pwaXphd2RydXpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4OTk2OTYsImV4cCI6MjA5NTQ3NTY5Nn0.8K7i5QEbjYWSvqw78P8RSR_abYM8uCRZbvC9Hp12bac";
    const ADMIN_NAME = "ADMIN";
    const GAME_VERSION = "2.0.0";
    document.getElementById("versionDisplay").innerText = "v" + GAME_VERSION;
    
    let currentPlayerName = null;
    let currentPvpBattle = null;
    
    // ЗВУКИ
    let audioCtx = null;
    function playSound(type) {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = "sine";
            gain.gain.value = 0.15;
            if (type === "attack") { osc.frequency.value = 440; gain.gain.exponentialRampToValue(0.00001, 0.3); }
            else if (type === "heal") { osc.frequency.value = 660; gain.gain.exponentialRampToValue(0.00001, 0.4); }
            else if (type === "victory") { osc.frequency.value = 880; gain.gain.exponentialRampToValue(0.00001, 0.5); }
            else if (type === "hit") { osc.frequency.value = 220; gain.gain.exponentialRampToValue(0.00001, 0.2); }
            else return;
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } catch(e) {}
    }
    
    function showToast(msg) {
        const toast = document.createElement("div");
        toast.className = "toast";
        toast.innerText = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }
    
    function addSys(msg, type = "system") { 
        let chat = document.getElementById("chatArea"); 
        let d = document.createElement("div"); 
        d.className = `msg ${type}`; 
        d.innerHTML = msg; 
        chat.appendChild(d); 
        chat.scrollTop = chat.scrollHeight; 
        if (chat.children.length > 200) chat.removeChild(chat.children[0]);
    }
    
    // ========== SUPABASE ФУНКЦИИ ==========
    async function supabaseQuery(endpoint, options = {}) {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/${endpoint}`, {
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
            ...options
        });
        return res.json();
    }
    
    async function supabaseLoadPlayer(username) {
        const data = await supabaseQuery(`players?username=eq.${encodeURIComponent(username)}`);
        return data?.[0] || null;
    }
    
    async function supabaseSavePlayer() {
        if (!currentPlayerName) return;
        await fetch(`${SUPABASE_URL}/rest/v1/players?username=eq.${currentPlayerName}`, {
            method: 'PATCH',
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({
                gold: player.gold,
                glory: player.glory,
                level: player.level,
                hp: player.hp,
                max_hp: player.maxHp,
                xp: player.xp,
                weapon_name: player.weapon?.name || null,
                weapon_dmg: player.weapon?.dmg || null,
                player_class: player.class
            })
        });
    }
    
    async function supabaseCreatePlayer(username) {
        const newPlayer = { username, gold: 800, glory: 0, level: 1, hp: 200, max_hp: 200, xp: 0, weapon_name: "⚔️ Ржавый меч", weapon_dmg: 12, player_class: null };
        const res = await fetch(`${SUPABASE_URL}/rest/v1/players`, {
            method: 'POST',
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
            body: JSON.stringify(newPlayer)
        });
        const data = await res.json();
        return data[0] || newPlayer;
    }
    
    async function supabaseTransferGold(toName, amount) {
        if (amount <= 0) return "❌ Сумма > 0";
        if (player.gold < amount) return "❌ Не хватает голды";
        if (toName === currentPlayerName) return "❌ Нельзя себе";
        const target = await supabaseLoadPlayer(toName);
        if (!target) return "❌ Игрок не найден";
        player.gold -= amount;
        await supabaseSavePlayer();
        await fetch(`${SUPABASE_URL}/rest/v1/players?username=eq.${toName}`, {
            method: 'PATCH',
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ gold: target.gold + amount })
        });
        return `💰 Передано ${amount} голды ${toName}!`;
    }
    
    async function supabaseShowTop() {
        const data = await supabaseQuery(`players?select=username,glory,gold,level&order=glory.desc&limit=10`);
        let msg = "🏆 ТОП-10 ПО СЛАВЕ 🏆<br>";
        data.forEach((p, i) => msg += `${i+1}. ${p.username} — ✨${p.glory} | 🪙${p.gold} | Ур.${p.level}<br>`);
        return msg;
    }
    
    async function fullSync() {
        if (!currentPlayerName) return;
        addSys("🔄 Синхронизация...");
        const dbPlayer = await supabaseLoadPlayer(currentPlayerName);
        if (dbPlayer) {
            player.gold = dbPlayer.gold;
            player.glory = dbPlayer.glory;
            player.level = dbPlayer.level;
            player.hp = dbPlayer.hp;
            player.maxHp = dbPlayer.max_hp;
            player.xp = dbPlayer.xp || 0;
            if (dbPlayer.weapon_name && dbPlayer.weapon_dmg) player.weapon = { name: dbPlayer.weapon_name, dmg: dbPlayer.weapon_dmg };
            if (dbPlayer.player_class) player.class = dbPlayer.player_class;
            updateUI();
            addSys("✅ Синхронизировано!");
        }
    }
    
    // ========== ПВП ФУНКЦИИ ==========
    async function pvpUpdate() {
        if (!currentPlayerName) return;
        
        // Проверка активного боя
        const activeBattle = await supabaseQuery(`pvp_battles?or=(challenger.eq.${currentPlayerName},opponent.eq.${currentPlayerName})&status=eq.active&order=created_at.desc&limit=1`);
        if (activeBattle && activeBattle.length > 0) {
            const battle = activeBattle[0];
            if (!currentPvpBattle || currentPvpBattle.id !== battle.id) {
                currentPvpBattle = battle;
                addSys(`⚔️ ПВП БОЙ: ${battle.challenger} vs ${battle.opponent} | Ставка: ${battle.challenger_bet + battle.opponent_bet}💰 | Ход: ${battle.turn}`);
                if (battle.challenger === currentPlayerName && battle.challenger_hp) player.hp = battle.challenger_hp;
                if (battle.opponent === currentPlayerName && battle.opponent_hp) player.hp = battle.opponent_hp;
                updateUI();
            }
            return;
        }
        
        // Проверка входящих вызовов (pending)
        const pendingCall = await supabaseQuery(`pvp_battles?opponent=eq.${currentPlayerName}&status=eq.pending&limit=1`);
        if (pendingCall && pendingCall.length > 0 && !currentPvpBattle) {
            const call = pendingCall[0];
            addSys(`📢 ВАС ВЫЗВАЛИ НА ПВП! ${call.challenger} вызвал вас на бой. Ставка: ${call.challenger_bet}💰`);
            addSys(`✅ Чтобы принять: /пвп ставка СУММА (сумма должна быть не меньше ${call.challenger_bet})`);
            addSys(`❌ Чтобы отклонить: /пвп отклонить`);
        }
        
        // Если нет активного боя и нет вызова — очищаем currentPvpBattle
        if (!activeBattle && (!pendingCall || pendingCall.length === 0) && currentPvpBattle) {
            currentPvpBattle = null;
        }
    }
    
    async function pvpMakeAttack() {
        if (!currentPvpBattle) { addSys("❌ Нет активного ПВП боя"); return false; }
        if (currentPvpBattle.turn !== currentPlayerName) { addSys("❌ Сейчас не твой ход"); return false; }
        
        const dmg = player.weapon?.dmg || 12;
        const isCrit = Math.random() < 0.1;
        let finalDmg = dmg + Math.floor(Math.random() * 10);
        if (isCrit) finalDmg = Math.floor(finalDmg * 1.75);
        
        const isChallenger = currentPvpBattle.challenger === currentPlayerName;
        let newHp;
        if (isChallenger) {
            newHp = (currentPvpBattle.opponent_hp || 200) - finalDmg;
            await fetch(`${SUPABASE_URL}/rest/v1/pvp_battles?id=eq.${currentPvpBattle.id}`, {
                method: 'PATCH',
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ opponent_hp: Math.max(0, newHp), turn: currentPvpBattle.opponent })
            });
            addSys(`⚔️ ${currentPlayerName} нанёс ${finalDmg}${isCrit ? " (КРИТ)" : ""} урона ${currentPvpBattle.opponent}!`);
        } else {
            newHp = (currentPvpBattle.challenger_hp || 200) - finalDmg;
            await fetch(`${SUPABASE_URL}/rest/v1/pvp_battles?id=eq.${currentPvpBattle.id}`, {
                method: 'PATCH',
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ challenger_hp: Math.max(0, newHp), turn: currentPvpBattle.challenger })
            });
            addSys(`⚔️ ${currentPlayerName} нанёс ${finalDmg}${isCrit ? " (КРИТ)" : ""} урона ${currentPvpBattle.challenger}!`);
        }
        
        if (newHp <= 0) {
            const winner = currentPlayerName;
            const loser = isChallenger ? currentPvpBattle.opponent : currentPvpBattle.challenger;
            const totalBet = currentPvpBattle.challenger_bet + currentPvpBattle.opponent_bet;
            await fetch(`${SUPABASE_URL}/rest/v1/pvp_battles?id=eq.${currentPvpBattle.id}`, {
                method: 'PATCH',
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: 'finished', winner })
            });
            // Выдача награды победителю
            const winnerData = await supabaseLoadPlayer(winner);
            if (winnerData) {
                await fetch(`${SUPABASE_URL}/rest/v1/players?username=eq.${winner}`, {
                    method: 'PATCH',
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ gold: winnerData.gold + totalBet })
                });
            }
            addSys(`🏆 ПОБЕДИТЕЛЬ: ${winner}! Получено ${totalBet}💰`);
            playSound("victory");
            currentPvpBattle = null;
            await fullSync();
        }
        await pvpUpdate();
        return true;
    }
    
    async function pvpCommand(cmd) {
        const parts = cmd.split(" ");
        const action = parts[1]?.toLowerCase();
        
        if (action === "вызвать" && parts[2] && parts[3]) {
            const opponent = parts[2];
            const bet = parseInt(parts[3]);
            if (isNaN(bet) || bet <= 0) { addSys("❌ Ставка должна быть > 0"); return; }
            if (player.gold < bet) { addSys("❌ Не хватает голды"); return; }
            if (opponent === currentPlayerName) { addSys("❌ Нельзя вызвать самого себя"); return; }
            
            const existing = await supabaseQuery(`pvp_battles?challenger=eq.${currentPlayerName}&status=eq.pending`);
            if (existing.length > 0) { addSys("❌ У тебя уже есть активный вызов"); return; }
            
            const opponentBusy = await supabaseQuery(`pvp_battles?or=(challenger.eq.${opponent},opponent.eq.${opponent})&status=eq.active`);
            if (opponentBusy.length > 0) { addSys("❌ Соперник уже в ПВП бою"); return; }
            
            const targetExists = await supabaseLoadPlayer(opponent);
            if (!targetExists) { addSys("❌ Игрок не найден"); return; }
            
            await fetch(`${SUPABASE_URL}/rest/v1/pvp_battles`, {
                method: 'POST',
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    challenger: currentPlayerName, 
                    opponent, 
                    challenger_bet: bet,
                    opponent_bet: 0,
                    status: 'pending',
                    challenger_hp: player.hp,
                    opponent_hp: player.maxHp,
                    turn: currentPlayerName
                })
            });
            addSys(`📢 Вызов отправлен ${opponent} на ${bet}💰. Ждите ответа.`);
            return;
        }
        
        if (action === "ставка" && parts[2]) {
            const bet = parseInt(parts[2]);
            if (isNaN(bet) || bet <= 0) { addSys("❌ Ставка должна быть > 0"); return; }
            if (player.gold < bet) { addSys("❌ Не хватает голды"); return; }
            
            const pending = await supabaseQuery(`pvp_battles?opponent=eq.${currentPlayerName}&status=eq.pending&limit=1`);
            if (!pending || pending.length === 0) { addSys("❌ Нет активного вызова к вам"); return; }
            const call = pending[0];
            
            if (bet < call.challenger_bet) { addSys(`❌ Ставка должна быть не меньше ${call.challenger_bet}💰`); return; }
            
            player.gold -= bet;
            await supabaseSavePlayer();
            
            await fetch(`${SUPABASE_URL}/rest/v1/pvp_battles?id=eq.${call.id}`, {
                method: 'PATCH',
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ opponent_bet: bet, status: 'active', turn: call.challenger })
            });
            addSys(`✅ Вы приняли вызов! Ставка: ${bet}💰. Бой начинается!`);
            await pvpUpdate();
            return;
        }
        
        if (action === "подтвердить") {
            const pending = await supabaseQuery(`pvp_battles?opponent=eq.${currentPlayerName}&status=eq.pending&limit=1`);
            if (!pending || pending.length === 0) { addSys("❌ Нет активного вызова к вам"); return; }
            const call = pending[0];
            if (player.gold < call.challenger_bet) { addSys(`❌ У вас нет ${call.challenger_bet}💰 для ставки`); return; }
            
            player.gold -= call.challenger_bet;
            await supabaseSavePlayer();
            
            await fetch(`${SUPABASE_URL}/rest/v1/pvp_battles?id=eq.${call.id}`, {
                method: 'PATCH',
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ opponent_bet: call.challenger_bet, status: 'active', turn: call.challenger })
            });
            addSys(`✅ Бой начался! Ставка ${call.challenger_bet}💰. Ход ${call.challenger}`);
            await pvpUpdate();
            return;
        }
        
        if (action === "отклонить") {
            const pending = await supabaseQuery(`pvp_battles?opponent=eq.${currentPlayerName}&status=eq.pending&limit=1`);
            if (!pending || pending.length === 0) { addSys("❌ Нет активного вызова к вам"); return; }
            const call = pending[0];
            await fetch(`${SUPABASE_URL}/rest/v1/pvp_battles?id=eq.${call.id}`, {
                method: 'PATCH',
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: 'cancelled' })
            });
            addSys(`❌ Вы отклонили вызов от ${call.challenger}`);
            await pvpUpdate();
            return;
        }
        
        if (action === "статус") {
            if (currentPvpBattle) {
                addSys(`⚔️ Активный ПВП бой: ${currentPvpBattle.challenger} (${currentPvpBattle.challenger_hp}❤️) vs ${currentPvpBattle.opponent} (${currentPvpBattle.opponent_hp}❤️) | Ход: ${currentPvpBattle.turn}`);
            } else {
                const pending = await supabaseQuery(`pvp_battles?opponent=eq.${currentPlayerName}&status=eq.pending&limit=1`);
                if (pending && pending.length > 0) {
                    addSys(`📢 Вам поступил вызов от ${pending[0].challenger} на ${pending[0].challenger_bet}💰`);
                } else {
                    addSys(`❌ Нет активных ПВП боёв или вызовов`);
                }
            }
            return;
        }
        
        addSys("❌ /пвп вызвать Имя 1000 | /пвп ставка 1000 | /пвп подтвердить | /пвп отклонить | /пвп статус");
    }

    function getWeaponDamage() { return (player.weapon ? player.weapon.dmg : 10) + weaponUpgrade * 5; }
    function getTotalDamageBonus() { return 1 + (talents.physical.bonus / 100); }
    function getCritChance() { return 0.05 + (talents.crit.bonus / 100); }
    function getMaxHpBonus() { return 1 + (talents.health.bonus / 100); }
    function getEquipmentBonus() { return (equipment.helmet?.armor||0) + (equipment.chest?.armor||0) + (equipment.boots?.armor||0) + (equipment.ring?.armor||0); }
    function getDamage() { return Math.floor((getWeaponDamage() + player.level * 1.2) * getTotalDamageBonus()) + Math.floor(Math.random() * 12); }
    
    function updateUI() {
        document.getElementById("className").innerText = player.class ? (player.class === "warrior" ? "Воин" : player.class === "mage" ? "Маг" : "Лучник") : "???";
        document.getElementById("lvl").innerText = player.level;
        document.getElementById("skillPointsDisplay").innerHTML = `⭐${talents.availablePoints}`;
        let maxHpBonus = Math.floor(player.maxHp * getMaxHpBonus());
        document.getElementById("hp").innerText = Math.floor(player.hp);
        document.getElementById("maxHp").innerText = maxHpBonus;
        document.getElementById("gold").innerText = Math.floor(player.gold);
        document.getElementById("glory").innerText = Math.floor(player.glory);
        let dmg = getWeaponDamage() + Math.floor(player.level * 1.2);
        document.getElementById("dmgStat").innerText = Math.floor(dmg);
        if (player.inBattle && player.currentEnemy) {
            document.getElementById("enemyPanel").style.display = "flex";
            document.getElementById("enemyName").innerText = player.currentEnemy.name;
            document.getElementById("enemyHp").innerText = Math.max(0, Math.floor(player.currentEnemy.hp));
            document.getElementById("enemyAtk").innerText = player.currentEnemy.atk;
        } else { document.getElementById("enemyPanel").style.display = "none"; }
    }
    
    async function attack() {
        if (currentPvpBattle) {
            await pvpMakeAttack();
            return;
        }
        if (!player.inBattle || !player.currentEnemy) { addSys("Нет боя!"); return; }
        let isCrit = Math.random() < getCritChance();
        let dmg = getDamage();
        if (isCrit) dmg = Math.floor(dmg * 1.75);
        player.currentEnemy.hp -= dmg;
        addSys(`⚔️ Урон ${dmg}${isCrit ? " (КРИТ)" : ""}. У ${player.currentEnemy.name} осталось ${Math.max(0, Math.floor(player.currentEnemy.hp))} HP.`);
        if (player.currentEnemy.hp <= 0) defeatEnemy();
        updateUI();
        supabaseSavePlayer();
    }
    
    async function defeatEnemy() {
        let goldGain = player.currentEnemy.gold + Math.floor(Math.random() * 60);
        let xpGain = player.currentEnemy.xp + player.level * 4;
        let gloryGain = player.currentEnemy.glory || 5;
        player.gold += goldGain;
        player.xp += xpGain;
        player.glory += gloryGain;
        addSys(`🏆 Победа! +${goldGain}💰 +${xpGain}✨ опыта +${gloryGain}✨ славы!`);
        playSound("victory");
        
        let need = 100 + player.level * 12;
        while (player.xp >= need) {
            player.level++;
            player.xp -= need;
            player.maxHp += 20;
            player.hp = player.maxHp;
            talents.availablePoints++;
            addSys(`✨ УРОВЕНЬ ${player.level}! +1 очко талантов!`);
            need = 100 + player.level * 12;
        }
        
        if (player.currentEnemy.key && Math.random() < player.currentEnemy.keyChance) {
            player.keys[player.currentEnemy.key] = (player.keys[player.currentEnemy.key] || 0) + 1;
            addSys(`🔑 Выпал ${player.currentEnemy.key}!`);
        }
        
        player.inBattle = false;
        if (player.attackInterval) clearInterval(player.attackInterval);
        player.currentEnemy = null;
        updateUI();
        supabaseSavePlayer();
    }
    
    function enemyAttack() {
        if (!player.inBattle || !player.currentEnemy) return;
        let dmg = Math.max(6, player.currentEnemy.atk + Math.floor(Math.random() * 14) - Math.floor(player.level * 0.3) - getEquipmentBonus());
        player.hp -= dmg;
        playSound("hit");
        addSys(`😖 ${player.currentEnemy.name} атакует! -${dmg} HP.`);
        if (player.hp <= 0) {
            addSys(`💀 Вы пали...`);
            player.hp = player.maxHp;
            player.inBattle = false;
            if(player.attackInterval) clearInterval(player.attackInterval);
            player.currentEnemy = null;
            supabaseSavePlayer();
        }
        updateUI();
    }

    async function processCommand(cmd) { 
        let c = cmd.trim().toLowerCase();
        if (c.startsWith("/админ")) { await adminCommand(cmd); return; }
        if (c.startsWith("/пвп")) { await pvpCommand(cmd); return; }
        if (c.startsWith("/передать")) {
            let parts = cmd.split(" ");
            if (parts.length >= 3) addSys(await supabaseTransferGold(parts[1], parseInt(parts[2])));
            return;
        }
        if (c === "/топ") { addSys(await supabaseShowTop()); return; }
        if (c === "/синхронизация") { await fullSync(); return; }
        if (c === "статы") addSys(`Ур.${player.level} ❤️${player.hp}/${player.maxHp} 🪙${player.gold} ✨${player.glory}`);
        else if (c === "помощь") addSys(`Команды: статы, /передать Имя 100, /топ, /синхронизация, /пвп вызвать/ставка/подтвердить/отклонить/статус, /админ хп/урон/броня/лвл/слава/голд/меч/все`);
        else addSys(`❓ Неизвестно`);
        document.getElementById("cmdInput").value = "";
    }
    
    async function adminCommand(cmd) {
        if (currentPlayerName !== ADMIN_NAME) { addSys("❌ Нет прав"); return; }
        const parts = cmd.split(" ");
        const action = parts[1]?.toLowerCase();
        const targetName = parts[2];
        const value = parts[3];
        if (!targetName) { addSys("❌ Укажите имя"); return; }
        if (action === "урон" && value) {
            await fetch(`${SUPABASE_URL}/rest/v1/players?username=eq.${targetName}`, {
                method: 'PATCH', headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ weapon_dmg: parseInt(value) })
            });
            addSys(`⚔️ Урон ${targetName} = ${value}`);
            if (targetName === currentPlayerName) await fullSync();
        } else if (action === "хп" && value) {
            await fetch(`${SUPABASE_URL}/rest/v1/players?username=eq.${targetName}`, {
                method: 'PATCH', headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ hp: parseInt(value), max_hp: parseInt(value) })
            });
            addSys(`❤️ HP ${targetName} = ${value}`);
            if (targetName === currentPlayerName) await fullSync();
        } else if (action === "лвл" && value) {
            await fetch(`${SUPABASE_URL}/rest/v1/players?username=eq.${targetName}`, {
                method: 'PATCH', headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ level: parseInt(value) })
            });
            addSys(`⭐ Уровень ${targetName} = ${value}`);
            if (targetName === currentPlayerName) await fullSync();
        } else if (action === "голд" && value) {
            await fetch(`${SUPABASE_URL}/rest/v1/players?username=eq.${targetName}`, {
                method: 'PATCH', headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ gold: parseInt(value) })
            });
            addSys(`🪙 Голда ${targetName} = ${value}`);
            if (targetName === currentPlayerName) await fullSync();
        } else if (action === "слава" && value) {
            await fetch(`${SUPABASE_URL}/rest/v1/players?username=eq.${targetName}`, {
                method: 'PATCH', headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ glory: parseInt(value) })
            });
            addSys(`✨ Слава ${targetName} = ${value}`);
            if (targetName === currentPlayerName) await fullSync();
        } else if (action === "меч") {
            const swordName = parts.slice(3, -1).join(" ");
            const swordDmg = parseInt(parts[parts.length - 1]);
            await fetch(`${SUPABASE_URL}/rest/v1/players?username=eq.${targetName}`, {
                method: 'PATCH', headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ weapon_name: swordName, weapon_dmg: swordDmg })
            });
            addSys(`⚔️ ${targetName} получил ${swordName} (+${swordDmg})`);
            if (targetName === currentPlayerName) await fullSync();
        } else if (action === "все") {
            const target = await supabaseLoadPlayer(targetName);
            if (target) addSys(`📊 ${targetName}: 🪙${target.gold} ✨${target.glory} ⭐${target.level} ❤️${target.hp}/${target.max_hp} ⚔️${target.weapon_dmg}`);
            else addSys("❌ Игрок не найден");
        } else addSys("❌ /админ урон/хп/лвл/голд/слава/меч/все");
    }
    
    // ========== ИНТЕРВАЛЫ ==========
    setInterval(() => { if(player.inBattle && player.currentEnemy && player.currentEnemy.hp>0 && player.hp>0) enemyAttack(); }, 4000);
    setInterval(() => { if (currentPlayerName) supabaseSavePlayer(); }, 30000);
    setInterval(() => { pvpUpdate(); }, 5000);
    
    // ========== КНОПКИ ==========
    document.getElementById("attackBtn").onclick = attack;
    document.getElementById("questBtn").onclick = showQuests;
    document.getElementById("bossListBtn").onclick = showBosses;
    document.getElementById("dailyBossBtn").onclick = dailyBossFight;
    document.getElementById("autoAttackBtn").onclick = toggleAutoAttack;
    document.getElementById("healBtn").onclick = heal;
    document.getElementById("autoHealBtn").onclick = toggleAutoHeal;
    document.getElementById("shopBtn").onclick = shop;
    document.getElementById("gloryShopBtn").onclick = gloryShop;
    document.getElementById("inventoryBtn").onclick = showInventory;
    document.getElementById("craftBtn").onclick = showCraft;
    document.getElementById("achievementsBtn").onclick = showAchievements;
    document.getElementById("dailyQuestsBtn").onclick = showDailyQuests;
    document.getElementById("talentsBtn").onclick = showTalents;
    document.getElementById("promoBtn").onclick = ()=>{};
    document.getElementById("themeBtn").onclick = toggleTheme;
    document.getElementById("sendBtn").onclick = () => { let inp = document.getElementById("cmdInput"); processCommand(inp.value); inp.value = ""; };
    
    // ========== ЛОГИН ==========
    document.getElementById("loginBtn").onclick = async () => {
        const name = document.getElementById("loginName").value.trim();
        if (!name) return;
        localStorage.setItem("savedPlayerName", name);
        let playerData = await supabaseLoadPlayer(name);
        if (!playerData) playerData = await supabaseCreatePlayer(name);
        currentPlayerName = name;
        player.gold = playerData.gold;
        player.glory = playerData.glory;
        player.level = playerData.level;
        player.hp = playerData.hp;
        player.maxHp = playerData.max_hp;
        player.xp = playerData.xp || 0;
        if (playerData.weapon_name && playerData.weapon_dmg) player.weapon = { name: playerData.weapon_name, dmg: playerData.weapon_dmg };
        if (playerData.player_class) player.class = playerData.player_class;
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("gameContainer").style.display = "block";
        if (!player.class) {
            document.getElementById("dynamicPanel").innerHTML=`<div class="class-selector"><div class="class-btn" id="classWar">⚔️ ВОИН</div><div class="class-btn" id="classMage">🔮 МАГ</div><div class="class-btn" id="classArch">🏹 ЛУЧНИК</div></div>`; 
            document.getElementById("dynamicPanel").classList.remove("hidden"); 
            document.getElementById("classWar").onclick=()=>{setClass("warrior"); document.getElementById("dynamicPanel").classList.add("hidden");};
            document.getElementById("classMage").onclick=()=>{setClass("mage"); document.getElementById("dynamicPanel").classList.add("hidden");};
            document.getElementById("classArch").onclick=()=>{setClass("archer"); document.getElementById("dynamicPanel").classList.add("hidden");};
        }
        updateUI();
    };
    
    const savedName = localStorage.getItem("savedPlayerName");
    if (savedName) document.getElementById("loginName").value = savedName;
    let savedTheme = localStorage.getItem("theme");
    if (savedTheme === "light") document.body.classList.add("light");
</script>
</body>
</html>
